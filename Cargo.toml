[package]
name = "game_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# ONLY wasm-bindgen for JavaScript interop - everything else built from scratch
[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dependencies.web-sys]
version = "0.3"
features = [
    # DOM basics
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Element",
    "HtmlElement",
    "Node",
    "console",
    "CssStyleDeclaration",
    
    # WebGL - Raw 3D graphics (like Three.js uses)
    "WebGlRenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "WebGl2RenderingContext",
    
    # Input
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "EventTarget",
    
    # Performance
    "Performance",
    
    # WebSocket for multiplayer
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

