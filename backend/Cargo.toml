[package]
name = "game_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# WebSocket server
tokio = { version = "1.41", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Serialization (efficient binary protocol)
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Performance
dashmap = "6.1"  # Concurrent HashMap (lock-free)
crossbeam = "0.8"  # Lock-free channels

# Networking
uuid = { version = "1.11", features = ["v4", "serde"] }

# Compression (for particle data)
lz4 = "1.28"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Config
dotenv = "0.15"

